apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: user-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: app1 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      containers:
        - name: app1
          image: traefik/whoami
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: user-demo
spec:
  selector: { app: app1 }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  namespace: user-demo
spec:
  rules:
    - host: app1.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port: { number: 80 }