name: Deploy Azure Functions

on:
  push:
    branches: [main, master]
    paths:
      - "azure-fn/**"
      - ".github/workflows/azure-functions.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: azure-fn/package-lock.json
      - name: Install & publish
        working-directory: azure-fn
        run: |
          npm ci
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          npm run build --if-present
          func azure functionapp publish "${{ secrets.AZURE_FUNCTIONAPP_NAME }}" --javascript